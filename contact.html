<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dragon Ember — Contact</title>
  <meta name="description" content="Contact Dragon Ember support and inquiries." />

  <style>
    :root {
      --bg-light: #fafafa;
      --bg-dark: #1a1a1a;
      --text-light: #222;
      --text-dark: #eaeaea;
      --accent: #d14b28;
      color-scheme: light dark;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #fdfdfd, #f3f3f3);
      color: #000;
      line-height: 1.6;
      padding-bottom: 2rem;
    }

    @media (prefers-color-scheme: dark) { body { background: linear-gradient(180deg, #1a1a1a, #111); color: var(--text-dark); } }

    .topbar { width:100%; background: rgba(3,6,12,0.45); backdrop-filter: blur(6px); padding:0.5rem 1rem; }
    .container { max-width:980px; margin:1.25rem auto; padding:0 1rem; }
    .brand { display:flex; align-items:center; gap:0.75rem; }
    .brand img { width:36px; border-radius:6px; }
    .brand-title { font-weight:700; color:#fff; }
    .nav { display:flex; gap:1rem; align-items:center; }
    .nav a { color: rgba(255,255,255,0.9); text-decoration:none; }

    header { text-align:center; padding:2.25rem 1rem; }
    h1 { margin:0; color:var(--accent); }

    .card { background: rgba(255,255,255,0.02); padding:1.5rem; border-radius:12px; box-shadow:0 8px 30px rgba(2,6,12,0.6); }

    form { max-width:720px; margin:0.75rem auto 0; display:flex; flex-direction:column; gap:0.75rem; }
    label { font-size:0.95rem; font-weight:600; }
    input[type="text"], input[type="email"], textarea {
      width:100%; padding:0.65rem 0.75rem; border-radius:8px; border:1px solid rgba(0,0,0,0.08); font-size:0.95rem;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.6);
    }
    textarea { min-height:140px; resize:vertical; }
    .form-actions { display:flex; gap:0.75rem; align-items:center; }
    button[type="submit"] { background:var(--accent); color:#fff; border:none; padding:0.6rem 1rem; border-radius:8px; cursor:pointer; }
    .note { font-size:0.9rem; color:rgba(0,0,0,0.6); }

    @media (prefers-color-scheme: dark) {
      input, textarea { background: rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.04); color:var(--text-dark); }
      .note { color: rgba(230,230,230,0.8); }
    }
  </style>
</head>

<body>

  <div class="topbar">
    <div class="container" style="display:flex;align-items:center;justify-content:space-between;">
      <div class="brand">
        <img src="assets/dragonemberlogo.png" alt="Dragon Ember" />
        <span class="brand-title">Dragon Ember</span>
      </div>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="features.html">Features</a>
        <a href="index.html#privacy">Privacy</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </div>

  <header>
    <div class="container">
      <h1>Contact Us</h1>
      <p>Send questions, feedback, or support requests. We aim to respond within 2 business days.</p>
    </div>
  </header>

  <div class="container">
    <div class="card">
      <p class="note">Prefer email? Reach us at <strong>shannon.white@dragon-ember.app</strong></p>

      <!-- This form uses mailto fallback for static sites. Replace action with server endpoint when available. -->
      <form action="mailto:shannon.white@dragon-ember.app" method="post" enctype="text/plain">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" placeholder="Your full name" required />

        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required />

        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="How can we help?" required></textarea>

        <!-- simple honeypot to reduce spam -->
        <input type="text" name="website" style="display:none" tabindex="-1" autocomplete="off" />

        <div class="form-actions">
          <button type="submit">Send Message</button>
          <span class="note">By contacting us you agree to our <a href="index.html#privacy">privacy policy</a>.</span>
        </div>
      </form>
    </div>
  </div>

  <footer style="text-align:center;padding:1rem;margin-top:2rem;color:rgba(255,255,255,0.7);">
    &copy; 2026 Dragon Ember
  </footer>

</body>
</html>
